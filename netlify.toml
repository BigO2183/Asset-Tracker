[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"


[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Big O Asset Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="dashboard">

      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h2 class="sidebar-title">Big O</h2>
        <nav>
          <button class="nav-item is-active">Dashboard</button>
          <button class="nav-item">Assets</button>
          <button class="nav-item">Checkouts</button>
          <button class="nav-item">History</button>
        </nav>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main">

        <!-- TOP CARDS -->
        <section class="top-cards">
          <div class="card">
            <p>Total Assets</p>
            <h3>1</h3>
          </div>

          <div class="card">
            <p>Available</p>
            <h3>1</h3>
          </div>

          <div class="card">
            <p>Checked Out</p>
            <h3>0</h3>
          </div>

          <div class="card">
            <p>Repairs Needed</p>
            <h3>0</h3>
          </div>
        </section>

        <!-- MAIN GRID -->
        <section class="grid">

          <!-- LEFT LIST -->
          <div class="panel">
            <h2>Equipment List</h2>

            <button class="asset-row is-selected" data-asset-id="EQ-001">
              <div>
                <strong>Milwaukee Drill</strong>
                <small>EQ-001 · Power Tool</small>
              </div>
              <span class="status available">Available</span>
            </button>
          </div>

          <!-- RIGHT DETAILS -->
          <div class="panel">
            <h2 id="asset-name">Milwaukee Drill</h2>
            <span class="status-badge" id="asset-status">Available</span>

            <div class="detail-grid">
              <div><label>Category</label><p id="asset-category">Power Tool</p></div>
              <div><label>Barcode</label><p id="asset-barcode">EQ-001</p></div>
              <div><label>Location</label><p id="asset-location">Warehouse</p></div>
              <div><label>Holder</label><p id="asset-holder">None</p></div>
              <div><label>Project</label><p id="asset-project">None</p></div>
              <div><label>Condition</label><p id="asset-condition">Good</p></div>
              <div><label>Checkout Date</label><p id="asset-checkout-date">None</p></div>
              <div><label>Return Date</label><p id="asset-return-date">None</p></div>
            </div>

            <form id="checkout-form" class="form-card">
              <h3>Checkout</h3>
              <label>
                Holder
                <input id="holder-input" type="text" placeholder="Employee name" />
              </label>
              <label>
                Project
                <input id="project-input" type="text" placeholder="Job name or number" />
              </label>

              <div class="actions">
                <button class="primary-button" type="submit">Checkout</button>
                <button class="secondary-button" id="return-button" type="button">Return</button>
              </div>
            </form>

            <div class="panel">
              <h3>Notes</h3>
              <p id="asset-notes">Test asset</p>
            </div>

            <div class="panel">
              <h3>QR Code</h3>
              <div id="qr-code"></div>
              <strong id="qr-label">EQ-001</strong>
              <button class="secondary-button" id="print-qr-button">Print QR</button>
            </div>

            <div class="panel">
              <h3>History</h3>
              <ul id="history-list">
                <li class="empty-history">No history yet</li>
              </ul>
            </div>

          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>

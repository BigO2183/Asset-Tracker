<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Big O Asset Tracker</title>
    <meta name="description" content="Big O Equipment Asset Tracking System" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="topbar">
      <h1>Big O Asset Tracker</h1>
      <span class="status-pill">1 Asset</span>
    </header>

    <main class="layout">
      <!-- LEFT SIDE LIST -->
      <aside class="asset-list">
        <h2>Equipment</h2>

        <button class="asset-item is-selected" data-asset-id="EQ-001">
          <div>
            <strong>Milwaukee Drill</strong>
            <small>EQ-001 · Power Tool</small>
          </div>
          <span class="availability">Available</span>
        </button>
      </aside>

      <!-- RIGHT SIDE DETAILS -->
      <section class="asset-detail">
        <div class="detail-header">
          <h2 id="asset-name">Milwaukee Drill</h2>
          <span class="status-badge" id="asset-status">Available</span>
        </div>

        <div class="detail-grid">
          <div><label>Category</label><p id="asset-category">Power Tool</p></div>
          <div><label>Barcode</label><p id="asset-barcode">EQ-001</p></div>
          <div><label>Location</label><p id="asset-location">Warehouse</p></div>
          <div><label>Holder</label><p id="asset-holder">None</p></div>
          <div><label>Project</label><p id="asset-project">None</p></div>
          <div><label>Condition</label><p id="asset-condition">Good</p></div>
          <div><label>Checkout Date</label><p id="asset-checkout-date">None</p></div>
          <div><label>Return Date</label><p id="asset-return-date">None</p></div>
        </div>

        <form id="checkout-form" class="checkout-card">
          <h3>Checkout</h3>
          <label>
            Holder
            <input id="holder-input" name="holder" type="text" placeholder="Employee name" />
          </label>
          <label>
            Project

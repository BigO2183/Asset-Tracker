<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Tracker Base v1</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">SMALL BUSINESS OPERATIONS</p>
      <h1>Inventory Tracker</h1>
    </div>
    <button id="adminToggle" class="ghost-btn">🔒 Admin Mode</button>
  </header>

  <main class="shell">
    <section class="hero-card">
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search item, ID, category, location, status, notes…" autocomplete="off" />
      </div>
      <div class="quick-actions">
        <button id="addItemBtn" class="primary-btn">＋ Add Item</button>
        <button id="showInventoryBtn" class="secondary-btn">Inventory</button>
        <button id="showHistoryBtn" class="secondary-btn">History</button>
      </div>
    </section>

    <section id="dashboard" class="dashboard-grid" aria-label="Inventory dashboard">
      <button class="stat-card" data-filter="all"><span>In Stock</span><strong id="statInStock">0</strong></button>
      <button class="stat-card" data-filter="checked-out"><span>Checked Out</span><strong id="statCheckedOut">0</strong></button>
      <button class="stat-card" data-filter="low-stock"><span>Low Stock</span><strong id="statLowStock">0</strong></button>
      <button class="stat-card attention" data-filter="attention"><span>Needs Attention</span><strong id="statAttention">0</strong></button>
    </section>

    <section id="inventorySection" class="panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">LIVE RECORDS</p>
          <h2>Inventory</h2>
        </div>
        <div class="filter-row">
          <select id="categoryFilter"><option value="">All categories</option></select>
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option>In Stock</option>
            <option>Checked Out</option>
            <option>Sold</option>
            <option>Reserved</option>
            <option>Needs Attention</option>
          </select>
        </div>
      </div>
      <div id="inventoryList" class="inventory-list"></div>
      <div id="emptyState" class="empty-state hidden">No matching inventory records.</div>
    </section>

    <section id="historySection" class="panel hidden">
      <div class="panel-head"><div><p class="eyebrow">AUDIT TRAIL</p><h2>History</h2></div></div>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <dialog id="itemDialog" class="dialog">
    <form id="itemForm" method="dialog" class="form-card">
      <div class="dialog-head">
        <div><p class="eyebrow">ITEM RECORD</p><h2 id="dialogTitle">Add Item</h2></div>
        <button type="button" id="closeDialog" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <input type="hidden" id="itemKey" />
      <div class="form-grid">
        <label>Photo URL<input id="photo" type="url" placeholder="https://…" /></label>
        <label>Item Name*<input id="name" required /></label>
        <label>Item ID / Barcode<input id="itemId" /></label>
        <label>Category<input id="category" /></label>
        <label>Quantity*<input id="quantity" type="number" min="0" step="1" value="1" required /></label>
        <label>Low Stock At<input id="lowStockAt" type="number" min="0" step="1" value="1" /></label>
        <label>Location<input id="location" placeholder="Shelf A3, Garage, Van 2…" /></label>
        <label>Status<select id="status"><option>In Stock</option><option>Checked Out</option><option>Sold</option><option>Reserved</option><option>Needs Attention</option></select></label>
        <label class="full">Notes<textarea id="notes" rows="4" placeholder="Condition, missing parts, project, customer, etc."></textarea></label>
      </div>
      <div class="form-actions">
        <button type="button" id="deleteItemBtn" class="danger-btn hidden">Delete</button>
        <div class="spacer"></div>
        <button type="button" id="cancelDialog" class="secondary-btn">Cancel</button>
        <button type="submit" class="primary-btn">Save Item</button>
      </div>
    </form>
  </dialog>

  <dialog id="adminDialog" class="dialog small">
    <form id="adminForm" method="dialog" class="form-card">
      <div class="dialog-head"><div><p class="eyebrow">ADMIN ACCESS</p><h2>Enter PIN</h2></div><button type="button" id="closeAdminDialog" class="icon-btn">✕</button></div>
      <label>PIN<input id="adminPin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" /></label>
      <p class="muted">Demo PIN: 1234. Change it in <code>app.js</code> before using this for a customer.</p>
      <div class="form-actions"><div class="spacer"></div><button type="submit" class="primary-btn">Unlock</button></div>
    </form>
  </dialog>

  <template id="itemTemplate">
    <article class="item-card">
      <div class="thumb-wrap"><img class="item-thumb" alt="" /><div class="placeholder-thumb">📦</div></div>
      <div class="item-main">
        <div class="item-title-row"><div><h3 class="item-name"></h3><p class="item-meta"></p></div><span class="status-pill"></span></div>
        <p class="item-notes"></p>
        <div class="item-bottom"><span class="qty-chip"></span><span class="location-chip"></span><button class="edit-btn hidden">Edit</button></div>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>

Yes — for GitHub you just need to paste the **SVG code** into the new file.

Create this file:

```text
icons/icon-192.svg
```

Then paste:

```html
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="42" fill="#25476A"/>
  <rect x="44" y="38" width="104" height="116" rx="20" fill="#FFFFFF"/>
  <path d="M70 75h52M70 96h52M70 117h34"
        stroke="#25476A"
        stroke-width="12"
        stroke-linecap="round"/>
  <circle cx="126" cy="119" r="11" fill="#3F7D61"/>
</svg>
```

Then create:

```text
icons/icon-512.svg
```

Paste:

```html
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#25476A"/>
  <rect x="118" y="102" width="276" height="308" rx="54" fill="#FFFFFF"/>
  <path d="M188 199h136M188 256h136M188 313h90"
        stroke="#25476A"
        stroke-width="30"
        stroke-linecap="round"/>
  <circle cx="333" cy="318" r="29" fill="#3F7D61"/>
</svg>
```

Then commit both. GitHub will treat them as image files automatically.
